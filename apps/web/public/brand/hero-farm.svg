<svg viewBox="0 0 640 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a calm broiler farm at sunrise">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf6ee"/>
      <stop offset="1" stop-color="#f7faf6"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b6650"/>
      <stop offset="1" stop-color="#17231f"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe9d4"/>
      <stop offset="1" stop-color="#aed9b8"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="640" height="480" rx="24" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="486" cy="150" r="54" fill="#dff2d1"/>
  <circle cx="486" cy="150" r="34" fill="#9ed9be"/>

  <!-- distant hills -->
  <path d="M0 330 Q160 286 320 322 T640 318 V480 H0 Z" fill="#d7eedd"/>
  <path d="M0 356 Q200 320 420 352 T640 352 V480 H0 Z" fill="url(#field)"/>

  <!-- main shed -->
  <g>
    <rect x="96" y="286" width="300" height="120" rx="8" fill="#ffffff" stroke="#cdddd2" stroke-width="2"/>
    <path d="M86 288 L246 214 L406 288 Z" fill="url(#roof)"/>
    <path d="M86 288 L246 214 L406 288" stroke="#9ed9be" stroke-width="3" stroke-linejoin="round" fill="none"/>
    <!-- louvres / doors -->
    <rect x="128" y="320" width="54" height="86" rx="4" fill="#eef5f0"/>
    <rect x="200" y="330" width="80" height="58" rx="5" fill="#e6f2e9"/>
    <line x1="210" y1="330" x2="210" y2="388" stroke="#cdddd2" stroke-width="2"/>
    <line x1="240" y1="330" x2="240" y2="388" stroke="#cdddd2" stroke-width="2"/>
    <line x1="270" y1="330" x2="270" y2="388" stroke="#cdddd2" stroke-width="2"/>
    <rect x="300" y="320" width="66" height="86" rx="4" fill="#eef5f0"/>
    <!-- vent fan -->
    <circle cx="333" cy="356" r="20" fill="#dff2d1" stroke="#64c38e" stroke-width="2"/>
    <path d="M333 341 L333 371 M318 356 L348 356" stroke="#64c38e" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- small second shed -->
  <g opacity="0.92">
    <rect x="420" y="320" width="150" height="86" rx="7" fill="#ffffff" stroke="#cdddd2" stroke-width="2"/>
    <path d="M412 322 L495 272 L578 322 Z" fill="url(#roof)"/>
  </g>

  <!-- feed silo -->
  <g>
    <rect x="52" y="300" width="34" height="106" rx="6" fill="#e6f2e9" stroke="#cdddd2" stroke-width="2"/>
    <path d="M52 300 L69 282 L86 300 Z" fill="#64c38e"/>
  </g>

  <!-- birds (simple calm forms) -->
  <g fill="#17231f">
    <path d="M250 430 c-7 0 -12 -4 -12 -10 c6 0 12 4 12 10 Z M250 430 c7 0 12 -4 12 -10 c-6 0 -12 4 -12 10 Z"/>
    <circle cx="250" cy="416" r="3"/>
    <path d="M300 436 c-6 0 -10 -3 -10 -8 c5 0 10 3 10 8 Z M300 436 c6 0 10 -3 10 -8 c-5 0 -10 3 -10 8 Z"/>
    <circle cx="300" cy="424" r="2.6"/>
    <path d="M205 440 c-5 0 -9 -3 -9 -7 c5 0 9 3 9 7 Z M205 440 c5 0 9 -3 9 -7 c-5 0 -9 3 -9 7 Z"/>
    <circle cx="205" cy="429" r="2.4"/>
  </g>

  <!-- flying birds in sky -->
  <g stroke="#6b8176" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M150 120 q10 -8 20 0 q10 -8 20 0"/>
    <path d="M210 150 q7 -6 14 0 q7 -6 14 0"/>
  </g>
</svg>
