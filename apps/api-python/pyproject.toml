[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "murgi-mitra-api"
version = "0.1.0"
description = "FastAPI entrypoint for Murgi Mitra."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "murgi-mitra-backend-core @ file:../../packages/backend-core",
]

[tool.setuptools]
packages = ["app"]
