# Self-hosted stack: PostgreSQL + API + web (nginx).
#
# From repo root:
#   cp .env.example .env
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# First-time DB schema (from repo root, with DATABASE_URL in .env):
#   pnpm install && pnpm run db:push
#   pnpm run seed

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-murgi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-murgi_mitra}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-murgi} -d ${POSTGRES_DB:-murgi_mitra}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-murgi}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-murgi_mitra}
      PORT: "8080"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api

volumes:
  pgdata:
