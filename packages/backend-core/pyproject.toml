[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "murgi-mitra-backend-core"
version = "0.1.0"
description = "Shared domain and infrastructure package for Murgi Mitra."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "PyJWT>=2.10,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
